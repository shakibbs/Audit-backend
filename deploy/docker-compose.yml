# CiV on a server that already runs Traefik (e.g. the n8n VPS). Starts portal + backend + database,
# plus Redis, the background worker and its clock.
# Run from this folder:  docker compose --env-file .env.production up -d --build
# Expects the portal repo (AUDIT) cloned next to this repo: ../../AUDIT/frontend

name: civ

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: civ
      POSTGRES_USER: civ
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]  # never on the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civ -d civ"]
      interval: 10s
      retries: 5

  backend:
    build: ..
    restart: unless-stopped
    env_file: .env.production
    environment: &backend_env
      DB_HOST: db
      DB_NAME: civ
      DB_USER: civ  # the owner; day to day the app switches to DB_APP_USER when set (config/settings.py)
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/app/media  # client documents; private, kept across updates
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      # Admin address: only the admin panel and its styles, never the client API.
      - traefik.http.routers.civ-admin.rule=Host(`${ADMIN_DOMAIN}`) && (Path(`/`) || PathPrefix(`/civ-admin`) || PathPrefix(`/static`))
      - traefik.http.routers.civ-admin.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.civ-admin.tls=true
      - traefik.http.routers.civ-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.civ-admin.service=civ-admin
      - traefik.http.services.civ-admin.loadbalancer.server.port=8000

  # The workers' to-do list. Holds job names and IDs only, never client records, and keeps nothing on disk.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # Background worker: runs the jobs (reading tools, the nightly seal, …). Same code as the backend.
  worker:
    build: ..
    restart: unless-stopped
    env_file: .env.production
    environment: *backend_env
    entrypoint: ["celery", "-A", "config", "worker", "--loglevel", "info", "--concurrency", "2"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  # The clock: puts jobs on the to-do list on a timetable (heartbeat every minute, nightly jobs).
  beat:
    build: ..
    restart: unless-stopped
    env_file: .env.production
    environment: *backend_env
    entrypoint: ["celery", "-A", "config", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      redis: {condition: service_healthy}
    networks: [internal]

  portal:
    build: ../../AUDIT/frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000  # inside Docker; the browser never talks to Django directly
    depends_on: [backend]
    networks: [internal, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.civ-portal.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.civ-portal.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.civ-portal.tls=true
      - traefik.http.routers.civ-portal.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.civ-portal.loadbalancer.server.port=3000

volumes:
  pgdata:
  media:

networks:
  internal: {}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
