# CiV Rulebook v3.0: every legal setting and parameter the engine uses (spec 02-rulebook-parameters.md).
# Change a value here, push, and it loads on deploy. Status: set = decided; proposed = runs, results provisional;
# tbd = never runs in a scored run (RULE_PENDING); `provisional` / `variants` are for draft runs and tests only.
# `jurisdictions` overrides the federal value for a state (or a court forum). Keys never say "scrub" or "screen".
version: '3.0'
status: provisional
effective_from: '2026-10-07'
